<?xml version="1.0" encoding="UTF-8"?>
<!-- secureclient-repack icon: a package trimmed down along a cut line.
     Rendered to icon.png by make-icon.sh — edit this file, not the PNG.
     Filled shapes only (no strokes or gradients) so every SVG renderer
     produces the same result. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#245e9c"/>

  <!-- package -->
  <rect x="146" y="232" width="220" height="164" rx="14" fill="#e8b86d"/>
  <rect x="132" y="204" width="248" height="52" rx="12" fill="#f2cd8c"/>
  <rect x="238" y="216" width="36" height="180" fill="#b97f3e"/>
  <rect x="238" y="204" width="36" height="52" fill="#a9702f"/>

  <!-- dashed cut line -->
  <g fill="#ffffff">
    <rect x="252" y="144" width="24" height="12" rx="6"/>
    <rect x="296" y="144" width="24" height="12" rx="6"/>
    <rect x="340" y="144" width="24" height="12" rx="6"/>
    <rect x="384" y="144" width="24" height="12" rx="6"/>
    <rect x="428" y="144" width="24" height="12" rx="6"/>
  </g>

  <!-- scissors on the cut line: two blades, two handle rings, pivot -->
  <g fill="#ffffff">
    <polygon points="148,143 234,120 238,133 152,157"/>
    <polygon points="148,157 234,180 238,167 152,143"/>
    <circle cx="112" cy="122" r="30"/>
    <circle cx="112" cy="178" r="30"/>
    <circle cx="152" cy="150" r="11"/>
  </g>
  <!-- handle holes punched in the background colour -->
  <circle cx="112" cy="122" r="17" fill="#245e9c"/>
  <circle cx="112" cy="178" r="17" fill="#245e9c"/>
</svg>
